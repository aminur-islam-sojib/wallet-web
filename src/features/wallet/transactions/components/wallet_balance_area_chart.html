-
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: var(--font-sans);
  }
  .wrap {
    padding: 1rem 0;
    max-width: 380px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 1.5rem;
  }
  .icon-box {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #3dbf96;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-box i {
    font-size: 26px;
    color: #fff;
  }
  .header-text p:first-child {
    font-size: 16px;
    font-weight: 500;
    color: var(--color-text-primary);
  }
  .header-text p:last-child {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-top: 1px;
  }
  .today-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .balance-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .balance-amount {
    font-size: 26px;
    font-weight: 500;
    color: var(--color-text-primary);
  }
  .edit-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .edit-btn i {
    font-size: 13px;
    color: var(--color-text-secondary);
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    height: 210px;
  }
</style>

<div class="wrap">
  <div class="header">
    <div class="icon-box"><i class="ti ti-coin" aria-hidden="true"></i></div>
    <div class="header-text">
      <p>Cash</p>
      <p>Cash</p>
    </div>
  </div>

  <p class="today-label">Today</p>
  <div class="balance-row">
    <span class="balance-amount" id="balanceDisplay">BDT 13,755.00</span>
    <div class="edit-btn"><i class="ti ti-pencil" aria-hidden="true"></i></div>
  </div>

  <div class="chart-wrap">
    <canvas
      id="balanceChart"
      role="img"
      aria-label="Balance history area chart showing account balance from Apr 24 to today, peaking around 20k in mid-May"
      >Balance history from Apr 24 to today.</canvas
    >
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  const isDark = matchMedia("(prefers-color-scheme: dark)").matches;

  const labels = [
    "Apr 24",
    "Apr 27",
    "Apr 30",
    "May 2",
    "May 4",
    "May 7",
    "May 9",
    "May 11",
    "May 13",
    "May 14",
    "May 16",
    "May 18",
    "May 20",
    "May 22",
    "Today",
  ];
  const balances = [
    200, 400, 600, 10800, 11200, 11000, 21000, 21200, 21000, 20500, 13800,
    13700, 13760, 13755, 13755,
  ];

  const areaColor = "#5BC8F5";
  const refLineColor = "#F48FB1";

  const ctx = document.getElementById("balanceChart").getContext("2d");

  const gradient = ctx.createLinearGradient(0, 0, 0, 200);
  gradient.addColorStop(0, "rgba(91,200,245,0.32)");
  gradient.addColorStop(0.7, "rgba(91,200,245,0.08)");
  gradient.addColorStop(1, "rgba(91,200,245,0.00)");

  const gridColor = isDark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.07)";
  const textColor = isDark ? "rgba(255,255,255,0.45)" : "rgba(0,0,0,0.40)";

  const refLinePlugin = {
    id: "refLine",
    afterDraw(chart) {
      const {
        ctx,
        scales: { x, y },
      } = chart;
      const yPx = y.getPixelForValue(0);
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = refLineColor;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x.left, yPx);
      ctx.lineTo(x.right, yPx);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = "10px sans-serif";
      ctx.fillStyle = refLineColor;
      ctx.textAlign = "right";
      ctx.fillText("BDT 0", x.right, yPx - 4);
      ctx.restore();
    },
  };

  new Chart(ctx, {
    type: "line",
    plugins: [refLinePlugin],
    data: {
      labels,
      datasets: [
        {
          data: balances,
          borderColor: areaColor,
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: areaColor,
          pointHoverBorderColor: "#fff",
          pointHoverBorderWidth: 2,
          fill: true,
          backgroundColor: gradient,
          tension: 0.38,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 900, easing: "easeInOutQuart" },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: isDark ? "#1e1e1e" : "#fff",
          borderColor: isDark ? "rgba(255,255,255,0.12)" : "rgba(0,0,0,0.10)",
          borderWidth: 0.5,
          titleColor: isDark ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.5)",
          bodyColor: isDark ? "#fff" : "#111",
          bodyFont: { size: 13, weight: "500" },
          titleFont: { size: 11 },
          padding: 10,
          cornerRadius: 8,
          displayColors: false,
          callbacks: {
            label: (ctx) =>
              "BDT " +
              ctx.parsed.y.toLocaleString("en-BD", {
                minimumFractionDigits: 2,
              }),
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          border: { display: false },
          ticks: {
            color: textColor,
            font: { size: 10 },
            maxRotation: 0,
            autoSkip: true,
            maxTicksLimit: 5,
          },
        },
        y: {
          position: "left",
          grid: {
            color: gridColor,
            drawBorder: false,
            drawTicks: false,
          },
          border: { display: false, dash: [4, 4] },
          ticks: {
            color: textColor,
            font: { size: 10 },
            padding: 6,
            maxTicksLimit: 4,
            callback: (v) => (v >= 1000 ? (v / 1000).toFixed(0) + "k" : v),
          },
          min: -500,
        },
      },
    },
  });
</script>
